<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="novix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e14" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="novix-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="novix-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="novix-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="novix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#novix-bg)" />
  <rect width="64" height="64" rx="16" stroke="url(#novix-stroke)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Glow Glow -->
  <circle cx="32" cy="32" r="14" fill="url(#novix-inner)" opacity="0.25" filter="url(#novix-glow)" />

  <!-- Stylized Geometric "N" Prism Mark -->
  <path
    d="M19 45V19L33 37V19M45 19V45L31 27V45"
    stroke="url(#novix-accent)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Shimmer Accent Sparkle -->
  <circle cx="45" cy="19" r="2.5" fill="#ffffff" />
  <circle cx="19" cy="45" r="2" fill="#22d3ee" />
</svg>
